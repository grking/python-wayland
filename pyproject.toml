[project]
name = "python-wayland"
dynamic = ["version"]
description = 'An implementation of the Wayland protocol with no external dependencies. A Python replacement for libwayland, not a wrapper for it.'
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = ["wayland", "libwayland"]
authors = [
  { name = "Graham King", email = "grking.email@gmail.com" },
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/grking/python-wayland"
Documentation = "https://github.com/grking/python-wayland#readme"
Issues = "https://github.com/grking/python-wayland/issues"
Source = "https://github.com/grking/python-wayland"
Changelog = "https://github.com/grking/python-wayland/blob/main/CHANGELOG.md"

[tool.hatch.envs.hatch-test]
randomize = false
parallel = false
extra-dependencies = [
  "lxml",
  "black",
  "ruff",
  "textual",
  "textual-dev",
  "pytest-textual-snapshot",
  "pytest-asyncio",
  "coverage",
  "pytest-cov"
]
extra-args = [
    "--import-mode=importlib",
    "--capture=no"
]
[tool.hatch.envs.hatch-test.scripts]
run = [
  "pytest --cov-report=xml --cov-config=pyproject.toml --cov=tests --asyncio-mode=auto",
]

[project.optional-dependencies]
debugger = [
    "textual",
]

[tool.hatch.envs.default]
dependencies = [
  "lxml",
  "textual",
  "textual-dev",
  "pytest-textual-snapshot",
]

[tool.hatch.envs.wayland]
extra-dependencies = [
  "mypy",
  "lxml",
  "black",
  "ruff"
]

[tool.hatch.envs.docs]
extra-dependencies = [
  "mypy",
  "black",
  "ruff",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.14",
  "mkdocstrings[python]",
  "markdown-callouts>=0.4",
  "markdown-exec>=1.8",
  "mkdocs-autorefs",
  "mkdocs-coverage>=1.0",
  "mkdocs-material>=9.5",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-minify-plugin>=0.8",
  "mkdocs-section-index>=0.3",
  "pydantic>=2.10",
]

[tool.hatch.envs.docs.scripts]
build = ["mypy", "mkdocs build"]
serve = "mkdocs serve"

[tool.hatch.envs.wayland.scripts]
update = "python -m wayland --download"
update-local = "python -m wayland"

[tool.hatch.envs.default.scripts]

docker-build = """
  docker compose -f docker/docker-compose.yml build base &&
  docker compose -f docker/docker-compose.yml -f docker/docker-compose.sway.yml build &&
  docker compose -f docker/docker-compose.yml -f docker/docker-compose.weston.yml build
"""
docker-stop = """
  docker compose -f docker/docker-compose.yml down -v &&
  docker compose -f docker/docker-compose.yml -f docker/docker-compose.weston.yml down -v &&
  docker compose -f docker/docker-compose.yml -f docker/docker-compose.sway.yml down -v
"""

docker-sway = "docker compose -f docker/docker-compose.yml -f docker/docker-compose.sway.yml run --rm --build env-sway-gui"
docker-sway-shell = "docker compose -f docker/docker-compose.yml -f docker/docker-compose.sway.yml run --rm --build env-sway-shell"
docker-weston = "docker compose -f docker/docker-compose.yml -f docker/docker-compose.weston.yml run --rm --build env-weston-gui"
docker-weston-shell = "docker compose -f docker/docker-compose.yml -f docker/docker-compose.weston.yml run --rm --build env-weston-shell"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "wayland/__about__.py"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.vscode",
  "example.py"
]

[tool.hatch.build.targets.wheel]
packages = ["wayland"]

[tool.coverage.run]
source_pkgs = ["wayland"]
branch = true
parallel = true
omit = [
  "wayland/__about__.py",
  "tests/*"
]

[tool.coverage.paths]
wayland = ["wayland"]

[tool.coverage.report]
show_missing = false
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
preview = false
extend-select = ["C901"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F403", "PERF401"]  # import *
"parser.py" = ["S320", "SLF001"]  # lxml
"proxy.py" = ["SLF001"]  # private members
"tests/*" = ["SLF001", "ARG002"]  # private members, mock args
"tests/test_parser.py" = ["ARG005"]  # lambda
"log.py" = ["FBT001"]  # bool param
"typehint.py" = ["FBT001"]  # bool param
"unixsocket.py" = ["BLE001"]  # blind exception
"__main__.py" = ["T201"]  # print
"*" = ["ARG001", "TRY003", "A002"]  # unused argument, builtin

[tool.ruff]
line-length = 88
exclude = [
  "wayland/__init__.pyi",
  "examples/",
]

[tool.pylint]
ignore-patterns = "*.pyi"

[tool.mypy]
files = ["wayland/client/"]
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "wayland"
ignore_errors = true

[[tool.mypy.overrides]]
module = "wayland.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "wayland.client.*"
ignore_errors = false